# Integración continua: corre en cada Pull Request hacia main y en cada push a main.
# Se amplía en la fase 1 con lint y con el job de web/.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Permisos mínimos para el token de GitHub (principio de mínimo privilegio)
permissions:
  contents: read

jobs:
  api:
    # OJO: este nombre es el check requerido por la regla protect-main-branch.
    # Si lo cambias, actualiza también la regla en GitHub o los PRs se quedan esperando.
    name: API · validar esquema Prisma
    runs-on: ubuntu-latest
    # Postgres desechable para los tests de integración (el mismo papel que api/docker-compose.test.yml en local).
    # Va en ESTE job, y no en uno nuevo, para que forme parte del check requerido sin tocar la regla.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gym_test
        ports:
          - 5432:5432
        # GitHub espera a que el contenedor esté sano antes de correr los pasos
        options: >-
          --health-cmd "pg_isready -U postgres -d gym_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    defaults:
      run:
        working-directory: api
    env:
      # URL ficticia: `prisma validate` no se conecta a la BD, pero la config la exige
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      # La BD del service container. El setup de los tests apunta DIRECT_URL aquí solo al migrar.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gym_test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Validar esquema
        run: npx prisma validate

      - name: Verificar formato del esquema
        run: npx prisma format --check

      # typecheck y build ejecutan `prisma generate` (el cliente generado no está en Git)
      - name: Revisar tipos
        run: npm run typecheck

      # Los tests unitarios usan un repositorio falso: no necesitan una BD real
      - name: Tests unitarios
        run: npm test

      # Repositorios reales de Prisma contra el Postgres del service container (migraciones incluidas)
      - name: Tests de integración
        run: npm run test:integration

      - name: Compilar
        run: npm run build
